<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#24262b">
  <meta name="description" content="מחברת בס — כתיבת תווים חינמית לטאבלט, לגמרי במכשיר.">
  <title>מחברת בס</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icons/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
  <link rel="stylesheet" href="./css/app.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("bass-notebook-v1-theme") || "system";
        var dark = t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        document.documentElement.setAttribute("data-theme-pref", t);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = dark ? "#1b1d21" : "#24262b";
      } catch (e) {}
    })();
  </script>
</head>
<body data-screen="list">
  <div id="app" class="app">
    <section id="screen-list" class="screen" data-screen="list" hidden></section>
    <section id="screen-settings" class="screen" data-screen="settings" hidden></section>
    <section id="screen-editor" class="screen editor" data-screen="editor" hidden>
      <header id="topbar" class="topbar"></header>
      <nav id="ribbon" class="ribbon" aria-label="סרגל כלים"></nav>
      <main class="desk" id="desk">
        <div class="desk-scroll" id="stage">
          <article class="paper" id="paper">
            <h1 id="doc-title"></h1>
            <div class="meta"><span id="doc-composer"></span><span id="doc-tempo"></span></div>
            <div id="score" dir="ltr"></div>
          </article>
        </div>
        <div id="status" class="status"></div>
      </main>
      <div id="piano-dock" class="piano-dock">
        <button type="button" id="piano-handle" class="piano-handle" aria-controls="piano-keys"></button>
        <div class="piano-scroll"><div id="piano-keys" class="piano-keys" dir="ltr"></div></div>
      </div>
      <div id="keypad" class="keypad float"></div>
      <button type="button" id="kp-show" class="kp-show" aria-label="הצגת הלוח" hidden></button>
      <div id="ctx" class="ctx" hidden></div>
      <div id="ghost" class="ghost" hidden></div>
    </section>
  </div>
  <div id="pop" hidden></div>
  <div id="toasts"></div>
  <script defer src="./vendor/vexflow/vexflow-bravura.js"></script>
  <script defer src="./vendor/jspdf/jspdf.umd.min.js"></script>
  <script defer src="./vendor/svg2pdf/svg2pdf.umd.min.js"></script>
  <script defer src="./js/data.js"></script>
  <script defer src="./js/music.js"></script>
  <script defer src="./js/model.js"></script>
  <script defer src="./js/layout.js"></script>
  <script defer src="./js/render.js"></script>
  <script defer src="./js/history.js"></script>
  <script defer src="./js/playback.js"></script>
  <script defer src="./js/musicxml.js"></script>
  <script defer src="./js/export.js"></script>
  <script defer src="./js/ui/icons.js"></script>
  <script defer src="./js/ui/toast.js"></script>
  <script defer src="./js/ui/ghost.js"></script>
  <script defer src="./js/ui/pop.js"></script>
  <script defer src="./js/ui/actions.js"></script>
  <script defer src="./js/ui/topbar.js"></script>
  <script defer src="./js/ui/ribbon.js"></script>
  <script defer src="./js/ui/keypad-layouts.js"></script>
  <script defer src="./js/ui/keypad.js"></script>
  <script defer src="./js/ui/contextbar.js"></script>
  <script defer src="./js/ui/piano.js"></script>
  <script defer src="./js/ui/list.js"></script>
  <script defer src="./js/ui/settings.js"></script>
  <script defer src="./js/editor.js"></script>
  <script defer src="./js/app.js"></script>
</body>
</html>
